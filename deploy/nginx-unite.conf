# nginx site for UNITE: serves the built website and passes /api to the Node server.
# Copy to /etc/nginx/sites-available/unite, replace unite.example.org with your address,
# link it into sites-enabled, then run certbot (see DEPLOY.md) to add HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name unite.example.org;

    root /opt/unite/frontend/dist;
    index index.html;
    server_tokens off;

    # Only the built website is served. Bots request /.env and /.git on every site, so any
    # hidden file or folder gets a plain 404 (certbot's /.well-known check still works).
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }
    location ~ /\. {
        return 404;
    }

    # Uploads: up to 5 files per claim (photos up to 10 MB, PDFs up to 3 MB)
    client_max_body_size 55m;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Built files have a content hash in their name, so they can be cached for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/unite-security-headers.conf;
        try_files $uri =404;
    }

    # Every other path is a page of the single-page app
    location / {
        add_header Cache-Control "no-cache";
        include snippets/unite-security-headers.conf;
        try_files $uri /index.html;
    }
}
