# Security headers for the UNITE website pages. The API sets its own through helmet.
# Copy to /etc/nginx/snippets/unite-security-headers.conf (see DEPLOY.md). nginx-unite.conf
# includes it in each location, because a location with its own add_header drops the server's.
#
# Content-Security-Policy: scripts only from this site; styles from this site, Google Fonts and
# inline style attributes (used by the animations); fonts from Google Fonts; images from this site
# plus blob: for the flyer preview before upload. No plugins, no other site may frame UNITE.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
# Browsers use HTTPS only for this site for a year (ignored until the site is on HTTPS)
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
